<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 专属美剧口语提取器 - 沉浸乐谱版</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Noto+Serif+SC:wght@400;600&display=swap');
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F6F1E8;
            color: #1F1A14;
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px 100px;
            line-height: 1.7;
        }
        .container {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(139,42,58,0.08);
            border-top: 6px solid #8B2A3A;
        }
        h1 {
            text-align: center;
            color: #8B2A3A;
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #4A3F32;
            margin-bottom: 30px;
            font-family: 'Noto Serif SC', serif;
        }
        input[type="file"] {
            width: 100%;
            padding: 20px;
            border: 1.5px dashed #C9BFA9;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: rgba(255,255,255,0.3);
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        input[type="file"]:hover {
            border-color: #8B2A3A;
            background-color: #F4E8D0;
        }
        button.main-btn {
            width: 100%;
            background-color: #1F1A14;
            color: #F6F1E8;
            border: none;
            padding: 16px;
            font-size: 14px;
            font-family: monospace;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }
        button.main-btn:hover { background-color: #8B2A3A; }
        button.main-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .loader {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #8B2A3A;
            font-family: 'Noto Serif SC', serif;
            font-style: italic;
        }
        
        .audio-tip {
            display: none;
            text-align: center;
            font-size: 13px;
            color: #8B2A3A;
            background: rgba(139,42,58,0.06);
            padding: 12px;
            margin-top: 20px;
            border-radius: 4px;
            font-weight: 600;
        }

        #readFloatBtn {
            display: none; position: absolute; background: #8B2A3A; color: white;
            border: none; padding: 6px 12px; font-size: 13px; border-radius: 20px;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 1000;
            font-family: 'Noto Serif SC', serif; animation: popIn 0.2s ease-out;
        }
        #readFloatBtn:hover { background: #1F1A14; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .legend-box {
            display: none; background: #F4E8D0; border-left: 4px solid #8B2A3A;
            padding: 15px 20px; margin-top: 30px; font-family: 'Noto Serif SC', serif;
            font-size: 14px; color: #1F1A14; line-height: 1.8; border-radius: 4px;
        }
        
        #result { margin-top: 20px; display: none; }
        
        #result h3 { 
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            color: #1F1A14; font-size: 24px; margin-top: 50px; 
            border-bottom: 2px solid #C9BFA9; padding-bottom: 10px;
        }
        
        .translation-box {
            background: #faf7f2; border-left: 4px solid #C9BFA9;
            padding: 20px 25px; margin: 20px 0; border-radius: 0 8px 8px 0;
        }
        .en-text {
            font-family: 'Cormorant Garamond', serif; font-size: 20px;
            color: #1F1A14; margin-bottom: 15px; line-height: 1.6;
        }
        .cn-text {
            font-family: 'Noto Serif SC', serif; font-size: 15px;
            color: #777; line-height: 1.7;
        }

        /* 乐谱核心排版 */
        .score-box {
            background: #ffffff; border: 1px dashed #C9BFA9;
            border-radius: 8px; padding: 25px 30px; margin: 20px 0;
            font-family: 'Cormorant Garamond', serif; font-size: 22px;
            line-height: 2.8; color: #4A3F32;
        }
        .score-box b {
            color: #8B2A3A; font-size: 1.25em; 
            border-bottom: 3px solid #8B2A3A; padding-bottom: 2px;
            margin: 0 2px; font-weight: bold; background: transparent;
        }
        .score-box i {
            color: #aaa; font-size: 0.75em; letter-spacing: -0.5px;
            font-style: normal; background: transparent;
        }
        /* 针对升降调箭头的专属强化样式 */
        .score-box span.tone {
            color: #8B2A3A; font-weight: bold; font-size: 1.1em;
            margin-left: 4px; font-family: -apple-system, sans-serif;
        }

        .timecode-highlight {
            font-family: monospace; background-color: rgba(139,42,58,0.08);
            color: #8B2A3A; padding: 4px 8px; border-radius: 4px; font-weight: bold;
            display: inline-block; margin-bottom: 15px;
        }
        
        #result ul { padding-left: 20px; color: #4A3F32; }
        #result li { margin-bottom: 10px; }
        #result code { background: #F4E8D0; color: #3D4A66; padding: 2px 6px; font-family: monospace; border-radius: 3px; font-size: 0.9em; }
    </style>
</head>
<body>

<button id="readFloatBtn">🔊 朗读</button>

<div class="container">
    <h1>🎬 Shadow Practice 提取器</h1>
    <div class="subtitle">乐谱精调版 · 语调指引全面回归</div>
    
    <div class="form-group">
        <input type="file" id="srtFile" accept=".srt,.txt">
    </div>

    <button id="analyzeBtn" class="main-btn" onclick="processSubtitle()">一键生成沉浸式教材</button>
    
    <div id="loading" class="loader">正在通读文本并绘制升降调乐谱，大约需要 20-30 秒...</div>
    
    <div id="audioTip" class="audio-tip">
        ✨ 提示：鼠标划选一长段句子或双击单词，点击弹出的「🔊 朗读」按钮即可收听发音。
    </div>

    <div id="legendBox" class="legend-box">
        <strong>🎼 乐谱怎么看？</strong><br>
        <span style="font-size:1.25em; color:#8B2A3A; border-bottom:3px solid #8B2A3A; font-weight:bold;">红字底线</span> = 必须重读、拉长元音<br>
        <span style="color:#aaa; font-size:0.85em;">灰色小字</span> = 必须弱读、像风一样滑过去<br>
        <span style="color:#3D4A66; font-weight:bold; font-size:1.2em;"> / </span> = 在这里换气或停顿<br>
        <strong style="color:#8B2A3A; font-size:1.1em;"> ↗ ↘ </strong> = 句尾升调（疑惑/激动）或 降调（肯定/陈述）
    </div>
    
    <div id="result"></div>
</div>

<script>
    const MY_API_KEY = "AIzaSyCYusYDy9kWs4fz5TPdsrt8MI1c1NGhA2U";

    const floatBtn = document.getElementById('readFloatBtn');
    
    document.addEventListener('mouseup', function(e) {
        if(e.target === floatBtn) return;
        setTimeout(() => {
            const selectedText = window.getSelection().toString().trim();
            if (selectedText && /[a-zA-Z]/.test(selectedText)) {
                floatBtn.style.display = 'block';
                floatBtn.style.left = e.pageX + 'px';
                floatBtn.style.top = (e.pageY - 40) + 'px';
            } else {
                floatBtn.style.display = 'none';
            }
        }, 10);
    });

    document.addEventListener('mousedown', function(e) {
        if(e.target !== floatBtn) floatBtn.style.display = 'none';
    });

    floatBtn.addEventListener('mousedown', function(e) {
        e.preventDefault(); 
        const selectedText = window.getSelection().toString().trim();
        if (selectedText) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(selectedText);
            utterance.lang = 'en-US'; 
            utterance.rate = 0.9; 
            window.speechSynthesis.speak(utterance);
            floatBtn.style.display = 'none';
        }
    });

    async function processSubtitle() {
        const fileInput = document.getElementById('srtFile');
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');
        const btn = document.getElementById('analyzeBtn');
        const legendBox = document.getElementById('legendBox');
        const audioTip = document.getElementById('audioTip');

        if (!fileInput.files.length) {
            alert('请先上传 SRT 字幕文件！');
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async function(e) {
            let content = e.target.result;
            content = content.replace(/\r/g, '');
            content = content.replace(/\n{3,}/g, '\n\n');

            const prompt = `你是一位顶尖的英文口语教练 + 文化评论编辑。
你的学生身份：独立媒体创作者，做关于东亚独立文化的付费 newsletter，queer/feminist 文化评论者。

下面是一集【带有时间轴】的美剧字幕。请精选最值得她练的 **3 段**（每段 20-45 秒）。
请严格按照以下 HTML 和 Markdown 混合格式输出：

### 🎬 精选片段 [序号]：[8-12字中文标题]

**【⏱️ 视频定位】**
<span class="timecode-highlight">[起始时间码] - [结束时间码]</span>

**【💡 为什么挑这段】**
（2-3句中文说明语境及学习价值）

**【📜 原文与翻译】**
<div class="translation-box">
<div class="en-text">(此处将所有英文合并成一整段。绝对禁止夹杂中文！)</div>
<div class="cn-text">(此处将所有中文合并成一整段。)</div>
</div>

**【🎼 跟读乐谱】**
<div class="score-box">
(⚠️ 乐谱排版强制规则：
1. 重读单词使用 <b>单词</b>
2. 弱读单词使用 <i>单词</i>
3. 短停顿使用 /
4. 句尾或意群结尾【必须】加上语调箭头，使用 <span class="tone">↗</span> 表示升调，或 <span class="tone">↘</span> 表示降调！
绝对禁止使用 Markdown 的星号或反引号！)
</div>

**【💎 生僻词汇与地道表达】**
- **[单词或短语]** \`[词性/类型]\` 
  - 释义：[中文释义]
  - 生活实战：*[造1个日常交际英文例句]*
  - 创作实战：*[造1个英文文化评论长句]*

**【🎯 实用句型提取】**
- **Pattern: \`[句式骨架，用X Y占位]\`**
  - 功能：[中文解析]
  - 生活实战：*[套用的日常口语例句]*
  - 创作实战：*[表达文化观点的英文长句]*

---
字幕文本：\n` + content;

            btn.disabled = true;
            loadingDiv.style.display = 'block';
            resultDiv.style.display = 'none';
            legendBox.style.display = 'none';
            audioTip.style.display = 'none';
            resultDiv.innerHTML = '';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${MY_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    alert('API 报错: ' + data.error.message);
                } else {
                    const markdownText = data.candidates[0].content.parts[0].text;
                    resultDiv.innerHTML = marked.parse(markdownText, { sanitize: false });
                    
                    loadingDiv.style.display = 'none';
                    audioTip.style.display = 'block';
                    legendBox.style.display = 'block';
                    resultDiv.style.display = 'block';
                }
            } catch (error) {
                alert('请求失败: ' + error.message);
            } finally {
                btn.disabled = false;
                loadingDiv.style.display = 'none';
            }
        };
        
        reader.readAsText(file, 'utf-8');
    }
</script>
</body>
</html>
