<!DOCTYPE html>
<html>
<head>
<style>
  .scrapbook-layout {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    padding: 40px;
    justify-content: center;
  }
  
  .card {
    width: 200px;
    height: 80px;
    background: #f8f9fa;
    border: 2px dashed #ccc;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    transition: transform 0.2s;
  }

  /* 模拟手工拼贴的错落感 */
  .card:nth-child(3n+1) { transform: rotate(-2deg); margin-top: 10px; }
  .card:nth-child(3n+2) { transform: rotate(3deg); margin-bottom: 10px; }
  .card:nth-child(3n)   { transform: rotate(-1deg); }
  
  .card:hover { transform: scale(1.05) rotate(0); z-index: 10; }
</style>
</head>
<body>
  <div class="scrapbook-layout">
    <div class="card">贴纸 1</div>
    <div class="card">贴纸 2</div>
    <div class="card">贴纸 3</div>
    <div class="card">贴纸 4</div>
    <div class="card">贴纸 5</div>
    <div class="card">贴纸 6</div>
  </div>
</body>
</html>
